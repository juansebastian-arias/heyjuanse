# Runs the AI extraction over the synthetic messages and pushes the stored outputs to a new branch
# for review. Started by hand from the Actions tab; never runs on its own.
#
# Needs the ANTHROPIC_API_KEY repository secret. The run summary shows the scorecard and links to a
# pre-filled pull request. A person opens it, so CI runs on it like on any other pull request.
name: Generate AI outputs

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: Weeks to run, separated by spaces, such as "2026-w41". Leave blank for all.
        required: false
        default: ""
      model:
        description: Model
        required: true
        default: claude-haiku-5-5
      effort:
        description: Effort
        type: choice
        options: [low, medium, high]
        default: low
      max_cost_usd:
        description: Stop when estimated spend reaches this many US dollars
        required: true
        default: "3"

permissions:
  contents: write

concurrency:
  group: ai-outputs
  cancel-in-progress: false

jobs:
  extract:
    # Pinned for the same reason as CI; see ci.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_MODEL: ${{ inputs.model }}
      AI_EFFORT: ${{ inputs.effort }}
      AI_MAX_COST_USD: ${{ inputs.max_cost_usd }}
      WEEKS: ${{ inputs.weeks }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Estimate the cost
        run: |
          args=()
          for week in $WEEKS; do args+=(--week "$week"); done
          pnpm ai:extract --dry-run "${args[@]}"

      - name: Run the extraction
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          for week in $WEEKS; do args+=(--week "$week"); done
          pnpm ai:extract "${args[@]}"

      - name: Check, test and build with the new outputs
        run: |
          pnpm check
          pnpm build

      - name: Score the outputs against the answer key
        run: |
          {
            echo "Stored AI outputs from \`$AI_MODEL\` at effort \`$AI_EFFORT\`, generated by the *Generate AI outputs* workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Typecheck, lint, unit tests and the production build passed in that run."
            echo
            pnpm --silent ai:eval --markdown
          } > "$RUNNER_TEMP/scorecard.md"

      - name: Keep the scorecard
        uses: actions/upload-artifact@v6
        with:
          name: scorecard
          path: ${{ runner.temp }}/scorecard.md
          retention-days: 30

      - name: Push the outputs to a branch for review
        run: |
          branch="ai-outputs/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/data
          if git diff --cached --quiet; then
            { echo "No changes to the stored outputs."; echo; cat "$RUNNER_TEMP/scorecard.md"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Add stored AI outputs from $AI_MODEL"
          git push origin "$branch"

          # A pull request opened with the workflow's own token would not start CI, so the summary
          # links to a pre-filled one for a person to open instead.
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="Stored AI outputs from $AI_MODEL"
          body="Stored AI outputs from \`$AI_MODEL\` at effort \`$AI_EFFORT\`. The scorecard against the answer key is in the [workflow run]($run_url) and in its \`scorecard\` artifact."
          # Parentheses are escaped too, so the URL cannot end the Markdown link early.
          query=$(node -e '
            const encode = (s) => encodeURIComponent(s).replace(/\(/g, "%28").replace(/\)/g, "%29");
            const [title, body] = process.argv.slice(1);
            console.log(`expand=1&title=${encode(title)}&body=${encode(body)}`);
          ' "$title" "$body")
          {
            echo "### Ready for review"
            echo
            echo "The outputs were pushed to \`$branch\`. [Open the pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch?$query) to run CI on them and review the scorecard below."
            echo
            cat "$RUNNER_TEMP/scorecard.md"
          } >> "$GITHUB_STEP_SUMMARY"
