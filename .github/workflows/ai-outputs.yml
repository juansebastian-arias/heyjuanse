# Runs the AI extraction over the synthetic messages and opens a pull request with the stored
# outputs and their scorecard. Started by hand from the Actions tab; never runs on its own.
#
# Needs the ANTHROPIC_API_KEY repository secret. To let the workflow open the pull request, enable
# Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
# Without it, the branch is still pushed and the log says how to open the pull request.
name: Generate AI outputs

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: Weeks to run, separated by spaces, such as "2026-w41". Leave blank for all.
        required: false
        default: ""
      model:
        description: Model
        required: true
        default: claude-haiku-5-5
      effort:
        description: Effort
        type: choice
        options: [low, medium, high]
        default: low
      max_cost_usd:
        description: Stop when estimated spend reaches this many US dollars
        required: true
        default: "3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-outputs
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_MODEL: ${{ inputs.model }}
      AI_EFFORT: ${{ inputs.effort }}
      AI_MAX_COST_USD: ${{ inputs.max_cost_usd }}
      WEEKS: ${{ inputs.weeks }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Estimate the cost
        run: |
          args=()
          for week in $WEEKS; do args+=(--week "$week"); done
          pnpm ai:extract --dry-run "${args[@]}"

      - name: Run the extraction
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          for week in $WEEKS; do args+=(--week "$week"); done
          pnpm ai:extract "${args[@]}"

      - name: Check, test and build with the new outputs
        run: |
          pnpm check
          pnpm build

      - name: Score the outputs against the answer key
        run: |
          {
            echo "Stored AI outputs from \`$AI_MODEL\` at effort \`$AI_EFFORT\`, generated by the *Generate AI outputs* workflow ([run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            echo "Typecheck, lint, unit tests and the production build passed in that run. Pull requests opened by a workflow do not start CI on their own; push any commit or close and reopen this pull request to run it."
            echo
            pnpm --silent ai:eval --markdown
          } > "$RUNNER_TEMP/scorecard.md"
          cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="ai-outputs/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes to the stored outputs."
            exit 0
          fi
          git commit -m "Add stored AI outputs from $AI_MODEL"
          git push origin "$branch"
          if ! gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
              --title "Stored AI outputs from $AI_MODEL" --body-file "$RUNNER_TEMP/scorecard.md"; then
            echo "::warning::The branch $branch was pushed, but the pull request could not be opened. Enable 'Allow GitHub Actions to create and approve pull requests', or open it by hand."
          fi
